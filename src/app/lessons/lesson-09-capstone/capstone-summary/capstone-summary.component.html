<div class="summary">
  <p class="stat">
    <span class="label">Total</span>
    <span class="value">{{ taskManager.totalCount }}</span>
  </p>
  <p class="stat">
    <span class="label">Done</span>
    <span class="value">{{ taskManager.completedCount }}</span>
  </p>
  <p class="stat">
    <span class="label">Left</span>
    <span class="value">{{ taskManager.totalCount - taskManager.completedCount }}</span>
  </p>
</div>
